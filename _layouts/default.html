<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#17394b">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%230a1925'/%3E%3Cpath d='M7 9h18M16 9v16' stroke='%23d7f473' stroke-width='3'/%3E%3Ccircle cx='7' cy='9' r='2.5' fill='%237acbd4'/%3E%3Ccircle cx='25' cy='9' r='2.5' fill='%237acbd4'/%3E%3Ccircle cx='16' cy='25' r='2.5' fill='%237acbd4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
  <script src="{{ '/site.js' | relative_url }}" defer></script>
</head>
<body id="top">
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="shell header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}">Taylor Research Lab</a>
    <button class="menu-toggle" aria-controls="main-nav" aria-expanded="false">Menu <span aria-hidden="true">+</span></button>
    <nav id="main-nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}"{% if page.nav == 'home' %} aria-current="page"{% endif %}>Home</a><a href="{{ '/research/' | relative_url }}"{% if page.nav == 'research' %} aria-current="page"{% endif %}>Research</a><a href="{{ '/people/' | relative_url }}"{% if page.nav == 'people' %} aria-current="page"{% endif %}>People</a><a href="{{ '/publications/' | relative_url }}"{% if page.nav == 'publications' %} aria-current="page"{% endif %}>Publications</a><a class="nav-contact" href="{{ '/' | relative_url }}#collaborate">Contact</a>
    </nav>
  </div>
</header>
<main id="main">
{{ content }}
</main>
<footer><div class="shell footer-inner"><a class="footer-brand" href="{{ '/' | relative_url }}">Taylor Research Lab</a><p>Computational biology · Data science · Physics</p><a href="#top">Back to top</a></div></footer>
</body>
</html>
